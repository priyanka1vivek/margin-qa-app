<text x="404" y="177" fill="#3a3d51" font-size="15" font-weight="bold">Both documents describe a review process before work is finalized.</text>
<text x="404" y="203" fill="#4b4d5e" font-size="13">The research overview emphasizes checking evidence and documenting</text><text x="404" y="224" fill="#4b4d5e" font-size="13">results. The project notes add a final approval step before release.</text>
