<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Margin sign-in interface preview</title><desc id="desc">Illustrative view of the Margin sign-in page with a dark editorial brand panel and a sign-in form.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24243f"/><stop offset="1" stop-color="#30294f"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b1832" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="620" rx="22" fill="#fff"/><path d="M22 0h556v620H22Q0 620 0 598V22Q0 0 22 0" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif"><rect x="52" y="44" width="40" height="40" rx="12" fill="#b9aaf0"/><path d="m72 52 4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#30294f"/><text x="104" y="75" fill="#fff" font-size="30" font-family="Georgia,serif" font-weight="bold">margin</text><circle cx="218" cy="69" r="4" fill="#b8a5ef"/>
<text x="52" y="193" fill="#c0b5ee" font-size="11" font-weight="bold" letter-spacing="3">YOUR IDEAS, GROUNDED IN YOUR DOCUMENTS</text>
<text x="52" y="271" fill="#fff" font-size="56" font-family="Georgia,serif" font-weight="bold">Answers with</text><text x="52" y="336" fill="#c6b4ff" font-size="58" font-family="Georgia,serif" font-style="italic">the receipts.</text>
<text x="52" y="395" fill="#c0c1d0" font-size="16">Bring your documents together. Ask anything.</text><text x="52" y="422" fill="#c0c1d0" font-size="16">Get clear answers with a direct path back to the source.</text>
<g transform="translate(65 470) rotate(-7)"><rect width="215" height="118" rx="12" fill="#f5f1e7"/><text x="22" y="30" fill="#80788a" font-size="10" font-weight="bold" letter-spacing="2">RESEARCH NOTES</text><rect x="22" y="49" width="160" height="6" rx="3" fill="#d9d4dc"/><rect x="22" y="67" width="133" height="6" rx="3" fill="#d9d4dc"/><rect x="22" y="85" width="148" height="6" rx="3" fill="#d9d4dc"/></g>
<g transform="translate(184 510) rotate(4)" filter="url(#shadow)"><rect width="300" height="72" rx="14" fill="#fff"/><path d="m30 21 4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#9380d4"/><text x="61" y="34" fill="#282840" font-size="16" font-family="Georgia,serif" font-weight="bold">Here’s what I found</text><text x="61" y="54" fill="#8d8b9a" font-size="11">Grounded in your sources ↗</text></g>
<text x="52" y="594" fill="#a7a4c0" font-size="16" font-family="Georgia,serif" font-style="italic">Read closely. Think clearly.</text>
<text x="665" y="178" fill="#786bbd" font-size="11" font-weight="bold" letter-spacing="3">WELCOME TO MARGIN</text><text x="665" y="235" fill="#28283e" font-size="36" font-family="Georgia,serif" font-weight="bold">Sign in to your library</text><text x="665" y="267" fill="#9293a0" font-size="14">Your documents, conversations, and sources in one place.</text>
<text x="665" y="326" fill="#333449" font-size="12" font-weight="bold">Email address</text><rect x="665" y="339" width="440" height="49" rx="8" fill="#fbfbfd" stroke="#e2e4ec"/><text x="683" y="369" fill="#b4b8c2" font-size="13">you@example.com</text>
<text x="665" y="423" fill="#333449" font-size="12" font-weight="bold">Password</text><rect x="665" y="436" width="440" height="49" rx="8" fill="#fbfbfd" stroke="#e2e4ec"/><text x="683" y="466" fill="#b4b8c2" font-size="13">At least 6 characters</text>
<rect x="665" y="516" width="440" height="50" rx="8" fill="#302e4f"/><text x="885" y="547" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Sign in →</text><text x="768" y="591" fill="#9999a5" font-size="12">New to Margin?</text><text x="866" y="591" fill="#7064bd" font-size="12" font-weight="bold">Create an account</text></g>
</svg>